name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - auth.js
      - supabase-config.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public website files
        run: |
          mkdir _site
          cp index.html styles.css app.js auth.js supabase-config.js _site/
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
